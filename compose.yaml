services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flags-net

  migrate:
    build:
      context: .
      target: dev
    command: ["npm", "run", "db:migrate"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flags-net

  app:
    build:
      context: .
      target: dev
    env_file: .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/app/src
        - action: rebuild
          path: ./package.json
    networks:
      - flags-net

  adminer:
    image: adminer:4.8.1
    ports:
      - "8081:8080"
    profiles:
      - tools
    networks:
      - flags-net

networks:
  flags-net:
    name: flags-net

volumes:
  db-data:
